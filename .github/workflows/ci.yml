name: Build and motion checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Native Icon Composer compilation needs the newer host asset runtime.
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node.js 24)
      - name: Show toolchain
        run: |
          # Use the image's maintained default, not the first (oldest) Xcode.
          xcodebuild -version
          swift --version
      - name: Run motion checks (no physical sensor or GPU required)
        run: bash scripts/test.sh --motion-only
      - name: Build locally signed app
        run: bash scripts/build.sh
      - name: Check bundle version
        run: |
          expected="Glissform $(cat VERSION)"
          actual="$(build/Glissform.app/Contents/MacOS/Glissform --version)"
          test "$actual" = "$expected"
